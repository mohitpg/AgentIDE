[project]
name = "agentide-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas, event types, and DTO definitions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
