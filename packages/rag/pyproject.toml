[project]
name = "agentide-rag"
version = "0.1.0"
description = "RAG utilities: chunking, embeddings, pgvector retrieval, reranking"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "fastembed>=0.4",            # local ONNX embeddings (BGE-small)
    "sentence-transformers>=3.0", # cross-encoder reranker
    "torch",                     # via sentence-transformers; direct so the root CPU-only source applies
    "pypdf>=5.0",                # PDF text extraction
    "agentide-schemas",
    "opentelemetry-api>=1.45",   # pipeline-stage spans (no-op unless the host exports)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
