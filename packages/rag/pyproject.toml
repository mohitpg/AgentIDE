[project]
name = "agentide-rag"
version = "0.1.0"
description = "RAG utilities: chunking, embeddings, pgvector retrieval, reranking"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "agentide-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
