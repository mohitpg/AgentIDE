# Alembic configuration – run from apps/api/
# uv run alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = src

# URL overridden dynamically in migrations/env.py from Settings
sqlalchemy.url = postgresql+asyncpg://agentide:agentide@localhost:5432/agentide

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
