[project]
name = "agentide-api"
version = "0.1.0"
description = "AgentIDE API Gateway – FastAPI, auth, routing, streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis[hiredis]>=5.2",
    "python-jose[cryptography]>=3.3",   # JWT
    "passlib[bcrypt]>=1.7",             # password hashing
    "langchain-core>=0.3",              # message types for the chat handler
    "agentide-schemas",
    "agentide-orchestrator",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
agentide-orchestrator = { workspace = true }
