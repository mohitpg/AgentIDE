name: Build images

# Reusable: builds the seven Python images from infra/docker/python.Dockerfile
# and pushes each to Artifact Registry as
# <GCP_REGION>-docker.pkg.dev/<GCP_PROJECT>/agentide/<image>:<tag>.
# The caller must grant id-token: write (Workload Identity Federation).

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to push, e.g. sha-abc1234
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      # Let the other images finish (and fill their cache) when one fails.
      fail-fast: false
      matrix:
        # The image is the workspace package minus "agentide-". Keep in step
        # with IMAGES in release.yml.
        image:
          - api
          - workers
          - agent-summarizer
          - agent-code
          - agent-rag
          - agent-vision
          - agent-web
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/agentide
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/python.Dockerfile
          build-args: PACKAGE=agentide-${{ matrix.image }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ inputs.tag }}
          push: true
          # A plain image manifest, no attestation index, so release.yml can
          # retag the exact digest.
          provenance: false
          sbom: false
          # One cache scope per image. mode=max also caches the build stage
          # (the locked deps and torch), which is most of the build time.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
