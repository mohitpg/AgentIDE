name: CI

on:
  # Pushes to main run these checks as the first stage of deploy-dev.yml, and
  # releases as the first stage of release.yml, through workflow_call.
  # Changes that touch only Markdown files don't run it.
  push:
    branches: [develop]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, develop]
    paths-ignore: ["**.md"]
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint and typecheck jobs are commented out for now; only the tests gate deploys.
