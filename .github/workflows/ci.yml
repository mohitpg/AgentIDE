  # ── Python tests ───────────────────────────────────────────────────────────
  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentide
          POSTGRES_PASSWORD: agentide
          POSTGRES_DB: agentide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentide"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://agentide:agentide@localhost:5432/agentide_test
      DATABASE_URL_SYNC: postgresql+psycopg2://agentide:agentide@localhost:5432/agentide_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v7

      # Caching stays on its default, auto: on for pushes and PRs, off for
      # releases (guarding the release run against a poisoned cache).
      - uses: astral-sh/setup-uv@v10.3.2  # no floating v10 tag exists
        with:
          version: "latest"

      - name: Install workspace deps
        run: uv sync --all-packages

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --tb=short

