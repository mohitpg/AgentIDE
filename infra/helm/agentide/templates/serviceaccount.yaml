# The api and worker pods' identity. Workload Identity maps it to IAM for the
# uploads bucket (bootstrap.sh binds ns/<namespace>/sa/<name> on the bucket).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "agentide.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
