{{- $sel := include "agentide.selectorLabels" (dict "root" $ "name" "api") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "agentide.labels" . | nindent 4 }}
    {{- $sel | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentide.labels" . | nindent 8 }}
        {{- $sel | nindent 8 }}
      annotations:
        {{- include "agentide.podAnnotations" . | nindent 8 }}
        {{- if .Values.uploads.enabled }}
        gke-gcsfuse/volumes: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- include "agentide.podSecurityContext" . | nindent 8 }}
      # Time for open WebSockets and in-flight chat streams to finish.
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: {{ include "agentide.image" (dict "root" $ "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentide-config
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            {{- include "agentide.databaseEnv" . | nindent 12 }}
            {{- include "agentide.rabbitmqEnv" . | nindent 12 }}
          # Startup covers the orchestrator connecting to Postgres and the RAG
          # models loading; after that, liveness only checks the port so a slow
          # database can't get the pod restarted.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "agentide.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        {{- include "agentide.dataVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "agentide.labels" . | nindent 4 }}
    {{- $sel | nindent 4 }}
  annotations:
    # Container-native load balancing, with the timeouts and health check in
    # the BackendConfig (ingress.yaml).
    cloud.google.com/neg: '{"ingress": true}'
    {{- if .Values.ingress.enabled }}
    cloud.google.com/backend-config: '{"default": "api"}'
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- $sel | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
