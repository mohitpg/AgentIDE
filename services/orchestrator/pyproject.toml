[project]
name = "agentide-orchestrator"
version = "0.1.0"
description = "LangGraph supervisor graph, state definitions, and checkpointing"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "psycopg[binary,pool]>=3.2",    # LangGraph Postgres checkpointer
    "agentide-schemas",
    "langchain-openrouter>=0.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
