[project]
name = "agentide-orchestrator"
version = "0.1.0"
description = "LangGraph supervisor graph, state definitions, and checkpointing"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "psycopg[binary,pool]>=3.2",    # LangGraph Postgres checkpointer
    "agentide-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
