[project]
name = "agentide-agent-indexer"
version = "0.1.0"
description = "Indexer agent – chunk, embed, upsert into pgvector (runs in Celery)"
requires-python = ">=3.12"
dependencies = [
    "agentide-agent-common",
    "agentide-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_indexer"]

[tool.uv.sources]
agentide-agent-common = { workspace = true }
agentide-rag = { workspace = true }
