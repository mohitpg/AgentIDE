[project]
name = "agentide-agent-vision"
version = "0.1.0"
description = "Vision agent – analyze-image, ocr, diagram-to-code"
requires-python = ">=3.12"
dependencies = [
    "agentide-agent-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_vision"]

[tool.uv.sources]
agentide-agent-common = { workspace = true }
