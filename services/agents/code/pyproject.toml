[project]
name = "agentide-agent-code"
version = "0.1.0"
description = "Code agent – generate, edit, refactor, explain, test (Phase 2)"
requires-python = ">=3.12"
dependencies = [
    "agentide-agent-common",
    "agentide-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_code"]

[tool.uv.sources]
agentide-agent-common = { workspace = true }
agentide-mcp = { workspace = true }
