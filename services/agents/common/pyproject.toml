[project]
name = "agentide-agent-common"
version = "0.1.0"
description = "Shared A2A server base, LLM client helpers, MCP client wrapper"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-openrouter>=0.2.3",
    "pydantic-settings>=2.5",
    "agentide-schemas",
    "agentide-mcp",
    "a2a-sdk>=0.3,<1.0",
    "pyyaml>=6.0",
    "agentide-telemetry",       # OpenTelemetry → OpenObserve for every agent
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_common"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
agentide-mcp = { workspace = true }
agentide-telemetry = { workspace = true }
