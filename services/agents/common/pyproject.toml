[project]
name = "agentide-agent-common"
version = "0.1.0"
description = "Shared A2A server base, LLM client helpers, MCP client wrapper"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "agentide-schemas",
    "agentide-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_common"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
agentide-mcp = { workspace = true }
