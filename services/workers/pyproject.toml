[project]
name = "agentide-workers"
version = "0.1.0"
description = "Celery task queue – indexing, vision, web-crawl, scheduled jobs"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "kombu>=5.4",          # RabbitMQ transport
    "redis[hiredis]>=5.2",
    "agentide-schemas",
    "agentide-rag",
    "agentide-agent-vision",  # reused by the vision queue task (Phase 5)
    "agentide-agent-web",     # reused by the web-crawl queue task (Phase 5)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]

[tool.uv.sources]
agentide-schemas = { workspace = true }
agentide-rag = { workspace = true }
agentide-agent-vision = { workspace = true }
agentide-agent-web = { workspace = true }
